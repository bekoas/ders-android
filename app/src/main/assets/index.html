<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f8">

<title>Beko Ders &#x2014; A&#xD6;F</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--line:#e7e9ee;--ink:#111827;--mut:#6b7280;--soft:#f0f1f4;--acc:#4f46e5;--acc2:#eef0ff;--ok:#16a34a;--okbg:#e8f7ee;--no:#dc2626;--nobg:#fdecec;--warn:#b45309;--warnbg:#fff6e6}
body.dark{--bg:#000;--card:#121418;--line:#23262d;--ink:#e8eaee;--mut:#8b919c;--soft:#1a1d23;--acc:#818cf8;--acc2:#1c1f3a;--ok:#4ade80;--okbg:#0f2a1a;--no:#f87171;--nobg:#2c1212;--warn:#fbbf24;--warnbg:#2a2110}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.45;touch-action:manipulation}
button{font:inherit;color:inherit;touch-action:manipulation}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:44px}
.hdr h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.hdr .sub{font-size:13px;color:var(--mut);font-weight:500}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.ib:active,.row:active,.opt:active,.chip:active,.btn:active,.tile:active{transform:scale(.98)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mut{color:var(--mut);font-size:14px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 2px 8px}
.stats{display:grid;grid-template-columns:1.3fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.stat .big small{font-size:15px;font-weight:600;color:var(--mut);margin-left:4px}
.hero{background:var(--acc);color:#fff;border:0}
body.dark .hero{background:#2b2f6b}
.hero .mut{color:rgba(255,255,255,.8)}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.hero .bar{background:rgba(255,255,255,.25)}.hero .bar i{background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;min-height:64px}
.em{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.row .tx{flex:1;min-width:0}
.row .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:13px;color:var(--mut)}
.row .bar{height:5px;margin-top:6px}
.chev{color:var(--mut);font-size:20px;flex:none}
.pct{font-size:13px;font-weight:700;color:var(--mut);flex:none;min-width:38px;text-align:right}
.tag{font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;cursor:pointer;margin:8px 0}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.okb{background:var(--ok);color:#fff}
body.dark .btn{color:#0b0d1a}body.dark .btn.sec{color:var(--ink)}body.dark .btn.okb{color:#04140a}
.dock{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 16px calc(env(safe-area-inset-bottom) + 12px);z-index:5}
.dock .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock .btn{margin:0}
.fc{text-align:left;padding:20px}
.fc .em{width:64px;height:64px;font-size:34px;border-radius:16px;margin-bottom:14px}
.fc h2{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 8px}
.fc p{font-size:18px;margin:0 0 12px}
.ex{border-left:3px solid var(--warn);background:var(--warnbg);padding:10px 12px;border-radius:0 10px 10px 0;font-size:16px;margin-top:10px}
.tip{border-left:3px solid var(--acc);background:var(--acc2);padding:10px 12px;border-radius:0 10px 10px 0;font-size:16px;margin-top:10px}
.ex b,.tip b{display:block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.say{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;margin-top:14px}
.q{font-size:20px;font-weight:700;line-height:1.35;margin:4px 0 14px;letter-spacing:-.01em}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-size:16px;min-height:56px}
.opt .k{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nobg)}.opt.no .k{background:var(--no);color:#fff}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 30px rgba(0,0,0,.08);transform:translateY(110%);transition:transform .25s ease}
.sheet.on{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet .h{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet.okS .h{color:var(--ok)}.sheet.noS .h{color:var(--no)}
.sheet .s{font-size:15px;color:var(--mut);margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:68px;cursor:pointer;font-weight:600;font-size:15px}
.tile.e{font-size:30px}
.tile.sel{border-color:var(--acc);background:var(--acc2)}
.tile.done{opacity:.25;pointer-events:none}
.tile.bad{border-color:var(--no);background:var(--nobg)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.flow div{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.flow .a{color:var(--mut)}
.code{font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--acc)}
.done{text-align:center;padding:28px 18px}
.done .big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.ring{width:56px;height:56px;flex:none}
.prog{height:4px;background:var(--soft);border-radius:99px;overflow:hidden;margin:0 0 14px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:6;height:48px;padding:0 16px;border-radius:24px;border:0;background:var(--ink);color:var(--bg);font-weight:700;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer}
.fab.on{display:flex}
.chat{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
.chat.on{display:flex}
.chat .top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.chat .msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word}
.m.u{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
body.dark .m.u{color:#0b0d1a}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.chat .qp{display:flex;gap:8px;overflow-x:auto;padding:8px 16px 0;scrollbar-width:none}
.chat .qp::-webkit-scrollbar{display:none}
.chat .qp button{flex:none;height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;cursor:pointer}
.chat form{display:flex;gap:8px;padding:10px 16px calc(env(safe-area-inset-bottom) + 10px)}
.chat input{flex:1;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;font:inherit;font-size:16px;outline:none}
.chat input:focus{border-color:var(--acc)}
.chat form button{width:48px;height:48px;border-radius:24px;border:0;background:var(--acc);color:#fff;font-size:18px;cursor:pointer}
.ls{margin-bottom:12px}
.ls .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.ls .hd .em{width:40px;height:40px;font-size:20px}
.ls h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.ls p{margin:0 0 8px;font-size:17px}
.skel{height:14px;border-radius:7px;background:var(--soft);margin:10px 0;animation:pl 1.2s infinite ease-in-out}
@keyframes pl{50%{opacity:.4}}
.mini{margin-top:6px}
</style>
</head>
